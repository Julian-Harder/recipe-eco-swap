name: tests

# Runs the fast tests on every push and pull request, so a broken parser or data file
# shows up as a red cross on the PR before it is merged.
# The AI smoke test (marked slow) is skipped here: it needs the 438 MB model.
# Run it locally before merging:  pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pytest
      - run: pytest -m "not slow" -rxs
